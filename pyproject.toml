[project]
name = "rag-retrieval-svc"
version = "0.2.0"
description = "RAG retrieval microservice — semantic search over document chunks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "sentence-transformers>=3.0.0",
    "pymilvus>=2.4.0",
    "pdf-oxide>=0.3.0",
    "office-oxide>=0.1.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.4.0",
    "python-docx>=1.1.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "onnxruntime-gpu>=1.20.0",
    "psycopg2-binary>=2.9.0",
    "minio>=7.0.0",
    "python-multipart>=0.0.32",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "milvus-lite>=3.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers[onnx]>=3.0.0"]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
